<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>St. Eric CMS — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{--navy-900:#0c2540;--navy-700:#1a4470;--gold:#f2ac3c;--panel:#f7f9fb;--ink:#12202f;--ink-soft:#64758a;--line:#e6ebf1;--warn:#c94f4f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--navy-900);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .card{background:#fff;border-radius:16px;padding:36px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .logo-row{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
  .crest{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--panel);margin-bottom:10px}
  .crest img{width:100%;height:100%;object-fit:cover}
  h1{font-family:'Poppins';font-size:16px;color:var(--navy-900);text-align:center}
  .sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:4px}
  .field{margin:16px 0}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:'Inter';font-size:14px;background:var(--panel)}
  .submit-btn{width:100%;background:var(--gold);color:var(--navy-900);font-weight:700;padding:12px;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-top:6px}
  .error{color:var(--warn);font-size:12.5px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="crest"><img src="assets/logo.png" alt="St. Eric High School logo"></div>
    <h1>ST. ERIC CMS</h1>
    <div class="sub">Sign in to manage the school website</div>
  </div>
  <form id="login-form">
    <div class="field"><label>Email</label><input type="email" id="email" required></div>
    <div class="field"><label>Password</label><input type="password" id="password" required></div>
    <button class="submit-btn" type="submit">Sign In</button>
    <div class="error" id="error-msg">Incorrect email or password.</div>
  </form>
</div>

<script src="assets/js/supabase-client.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');
  errorMsg.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    errorMsg.textContent = error.message;
    errorMsg.style.display = 'block';
    return;
  }
  window.location.href = 'admin-dashboard.html';
});

// If already signed in, skip straight to the dashboard
(async ()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(session) window.location.href = 'admin-dashboard.html';
})();
</script>
</body>
</html>
